[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalef"
version = "1.0.0"
description = "Scale-oriented continuation of SuperF for multi-image super-resolution"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sander Riisøen Jyhne", email = "sander.jyhne@uia.no"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["super-resolution", "satellite", "implicit-neural-representations", "deep-learning", "remote-sensing"]

dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchmetrics>=0.11.0,<2.0.0",
    "numpy>=1.20.0,<3.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
    "lpips>=0.1.4",
    "einops>=0.6.0",
    "wandb>=0.15.0",
    "pillow>=9.0.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "kornia>=0.7.0,<0.8.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sjyhne/scalef"
Documentation = "https://github.com/sjyhne/scalef#readme"
Repository = "https://github.com/sjyhne/scalef"
Issues = "https://github.com/sjyhne/scalef/issues"

[project.scripts]
scalef-train = "optimize:main"

[tool.setuptools]
packages = ["models", "input_projections"]
py-modules = ["optimize", "optimize_against_folder", "optimizers", "data", "losses", "utils", "viz_utils", "create_data_from_single_image", "extract_force_datacube"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
